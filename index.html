<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will or Going To?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div id="inicio">
        <h1>WILL OR GOING TO?</h1>

        <p>Choose the correct future tense!</p>

        <div class="info">

            <div>
                <h2>WILL</h2>
                <p>
                    Decisions made at the moment,
                    promises and predictions.
                </p>
                <p>Example: I <b>will</b> help you.</p>
            </div>

            <div>
                <h2>BE GOING TO</h2>
                <p>
                    Plans already decided and
                    predictions based on evidence.
                </p>
                <p>Example: I am <b>going to</b> study.</p>
            </div>

        </div>

        <button onclick="startGame()">START GAME</button>
    </div>


    <div id="jogo" style="display:none;">

        <div class="top">
            <span>Question <span id="numero">1</span>/10</span>
            <span>Score: <span id="pontos">0</span></span>
        </div>

        <div class="barra">
            <div id="progresso"></div>
        </div>

        <div class="pergunta">
            <h2 id="texto-pergunta"></h2>

            <div id="alternativas"></div>
        </div>

        <p id="resultado"></p>

        <button id="proxima" onclick="nextQuestion()" style="display:none;">
            NEXT →
        </button>

    </div>


    <div id="fim" style="display:none;">

        <h1>GAME OVER!</h1>

        <h2>
            Your score:
            <span id="pontuacao-final"></span>/10
        </h2>

        <p id="mensagem-final"></p>

        <button onclick="restartGame()">PLAY AGAIN</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
